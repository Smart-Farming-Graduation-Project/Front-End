# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Crop-Guard-UI

on:
  push:
    branches:
      - Production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
  
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
  
      - name: Upload ZIP to Azure Storage
        run: |
          az storage blob upload --account-name ${{ secrets.STORAGE_ACCOUNT_NAME }} \
            --container-name ${{ secrets.STORAGE_CONTAINER_NAME }} \
            --name crop-guard-ui.zip \
            --file release.zip \
            --auth-mode key
  
      - name: Get ZIP URL
        run: |
          echo "ZIP_URL=https://${{ secrets.STORAGE_ACCOUNT_NAME }}.blob.core.windows.net/${{ secrets.STORAGE_CONTAINER_NAME }}/crop-guard-ui.zip" >> $GITHUB_ENV
  
      - name: Deploy using Run From Package
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Crop-Guard-UI'
          slot-name: 'Production'
          package: ${{ env.ZIP_URL }}
